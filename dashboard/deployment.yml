apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-dashboard
  labels:
    app: homelab-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-dashboard
  template:
    metadata:
      labels:
        app: homelab-dashboard
    spec:
      containers:
        - name: homelab-dashboard
          imagePullPolicy: Always
          image: 970547335250.dkr.ecr.ap-south-1.amazonaws.com/homelab-dashboard:latest-alpha
          ports:
            - containerPort: 80