configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: homelab-velero-backups-nonprod
      prefix: velero
      config:
        region: ap-south-1

  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: ap-south-1

credentials:
  useSecret: false

serviceAccount:
  server:
    create: true
    name: velero # DO NOT CHANGE, BOUND TO ALLOWED PRINCIPALS IN AWS IAM ROLE
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::970547335250:role/velero-irsa-role

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.0
    volumeMounts:
      - mountPath: /target
        name: plugins
  - name: velero-plugin-for-csi
    image: velero/velero-plugin-for-csi:v0.7.0
    imagePullPolicy: IfNotPresent

securityContext:
  fsGroup: 65534

# Disable file‑system backups
defaultVolumesToFsBackup: false

# Do not deploy the node‑agent (used for FSB / Kopia)
nodeAgent:
  enabled: false

# Restic (legacy path) disabled as well
restic:
  enabled: false

# Optional: set tolerations/affinity if needed
deployNodeAgent: false

# Resource tuning for server (optional)
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Avoid any restic repositories or daemonset creation
features:
  enableRestic: false
  enableKopia: false
