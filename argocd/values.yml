global:
  domain: argocd.deploywizard.in

redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  autoscaling:
    enabled: true
    minReplicas: 1
  extraArgs:
    - --insecure

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 1

applicationSet:
  replicas: 1

configs:
  secret:
    argocdServerAdminPassword: "__BCRYPT_HASH__"